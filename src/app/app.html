<header class="app-header">
  <h1 class="app-title">Vier Gewinnt</h1>
  <img src="src/pepe.jpg" alt="Pepe" class="pepe-logo" />
</header>

<main class="app-content">
  <div class="game-area">
    <div class="player-box player-1" [class.active]="currentPlayer() === playerOne">
      Spieler 1
    </div>

    <div class="board">
      @for (row of grid(); track $index; let rowIndex = $index) {
        <div class="board-row">
          @for (cell of row; track $index; let columnIndex = $index) {
            <div
              class="board-cell"
              [class.empty]="cell === 'empty'"
              [class.yellow]="cell === 'yellow'"
              [class.red]="cell === 'red'"
              (click)="placeToken(rowIndex, columnIndex)">
            </div>
          }
        </div>
      }
    </div>

    <div class="player-box player-2" [class.active]="currentPlayer() === playerTwo">
      Spieler 2
    </div>
  </div>
</main>

<router-outlet />

<header class="app-header">
  <h1 class="app-title">Vier Gewinnt</h1>
  <img src="/pepe.jpg" alt="Pepe" class="pepe-logo" />
</header>

<main class="app-content">
  <div class="game-area">
    <div
      class="player-box player-1"
      [class.active]="activePlayer() === 1">
      Spieler 1
    </div>
    <div class="board" (click)="togglePlayer()">
      @for (row of grid(); track $index) {
        <div class="board-row">
          @for (cell of row; track $index) {
            <div class="board-cell"></div>
          }
        </div>
      }
    </div>
    <div class="player-box player-2"
         [class.active]="activePlayer() === 2">
      Spieler 2
    </div>
  </div>
</main>
